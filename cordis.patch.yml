# ============================================================================
# dsh-chat-index — DeepSeek Harness bundle patch
#
# Inserts this bundle's host (Node) entry into the Loader tree. The host
# entry registers the lightweight question-index endpoint
# (`/chat-index.questions`) that the browser half reads to index every
# user question WITHOUT expanding the 50-message history window. The node
# half also scans enabled Loader entries for web `dsh.client` packages, so
# no client-side row is needed here — the browser bundle is picked up from
# package.json's `dsh.client` + `exports["./client"]` automatically.
# ============================================================================

- insert:
    - id: dsh-chat-index
      name: 'dsh-chat-index'
